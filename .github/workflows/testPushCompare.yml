name: Test push compare
on:
  push:
    branches: [Rory-TestPushCompare]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Going to add amend
      - uses: actions/github-script@e7aeb8c663f696059ebb5f9ab1425ed2ef511bdb
        with:
          script: |
            const commitMessages = context.payload.commits.map(commit => commit.message);
            console.log(commitMessages);
            const isCherryPick = commitMessages.some(message => /.*\(cherry-picked to staging by .*\)$/.test(message));
            console.log('Is cherry pick?', isCherryPick);
